name: FukReg
options:
  bundleIdPrefix: app.fukreg
  deploymentTarget:
    iOS: "17.0"
targets:
  FukReg:
    type: application
    platform: iOS
    sources: [FukReg]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fukreg.client
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: FukReg/Info.plist
