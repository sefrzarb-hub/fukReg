name: iOS build
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project FukReg.xcodeproj -target FukReg -configuration Release \
            -sdk iphoneos SYMROOT=build/Build/Products CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcb.log \
            || { grep -E "error:" xcb.log | sort -u | head -40 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload && cp -r FukReg.app Payload/
          zip -r ../../../../FukReg-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FukReg-unsigned-ipa
          path: ios/FukReg-unsigned.ipa
