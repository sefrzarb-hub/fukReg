name: iOS build
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Generate project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project FukReg.xcodeproj -scheme FukReg -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload && cp -r FukReg.app Payload/
          zip -r ../../../../FukReg-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FukReg-unsigned-ipa
          path: ios/FukReg-unsigned.ipa
